// 16:9 widescreen (KatarnEngine). Change the size to your monitor: 1920 1080, 2560 1440 or 3840 2160
seta r_mode "-1"
seta r_customwidth "2560"
seta r_customheight "1440"
seta cg_fov "80"
// keep the vertical view of 4:3 and widen the sides (no zoomed-in look)
seta cg_fovAspectAdjust "1"
seta cg_fovViewmodelAdjust "1"
